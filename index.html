<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>Intervalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one-screen scoreboard; routine tabs on top, current exercise above the dial, routine list below controls. Single dark look by choice. */
  :root {
    color-scheme: dark;
    --bg: #0e1214;
    --surface: #161b1e;
    --line: #283034;
    --fg: #eef3f1;
    --muted: #8b9893;
    --prep: #f4b73a;
    --work: #ff5b3a;
    --rest: #3cc4a6;
    --ink-on-phase: #0e1214;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; }

  .app { --phase: var(--prep); min-height: 100%; box-sizing: border-box;
    background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--phase) 20%, transparent), transparent 62%), var(--bg);
    transition: background-color .4s; }
  .app[data-phase="work"] { --phase: var(--work); }
  .app[data-phase="rest"] { --phase: var(--rest); }
  .app[data-phase="done"] { --phase: var(--rest); }

  .wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 28px;
    display: flex; flex-direction: column; gap: 20px; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .total { text-align: right; display: flex; flex-direction: column; gap: 2px; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 600; }
  .total strong { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }

  .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .tab { height: 40px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; border-radius: 8px; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--line); color: var(--fg); }

  .current { display: grid; grid-template-columns: 140px minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 14px; row-gap: 4px;
    align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 80%, transparent); }
  .current .fig { grid-row: 1 / 4; align-self: center; width: 100%; height: auto; }
  .now-name { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 5.6vw, 28px); line-height: 1; text-transform: uppercase; letter-spacing: .02em; transition: color .3s; }
  .app[data-phase="work"][data-status="running"] .now-name { color: var(--phase); }
  .now-note { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.35; }

  /* Exercise figures: drawn from joint coordinates (viewBox 0 -6 200 132, floor at y=121). Far-side limbs muted for depth. */
  .fig { display: block; overflow: visible; }
  .fig polyline { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .fig .near { stroke: var(--fg); }
  .fig .far { stroke: var(--muted); }
  .fig .hot { stroke: var(--phase); transition: stroke .3s; }
  .fig .head { fill: var(--fg); }
  .fig .floor { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
  .fig .wall { stroke: #3d474b; stroke-width: 5; stroke-linecap: round; }
  .fig .wallfill { fill: color-mix(in srgb, var(--line) 45%, transparent); }
  .fig .band { stroke: var(--phase); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .fig .cord { stroke: var(--muted); stroke-width: 2; }
  .fig .acc { fill: var(--phase); }
  .fig .edge { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
  .fig .finger { stroke: var(--phase); stroke-width: 4.5; stroke-linecap: round; }
  .fig .pad { fill: var(--line); }

  .dial { position: relative; width: min(100%, 40vh, 320px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; container-type: inline-size; }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--line); stroke-width: 7; }
  .prog { fill: none; stroke: var(--phase); stroke-width: 7; stroke-linecap: round; transition: stroke .3s; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqi; text-align: center; }
  .phase-label { color: var(--phase); font-weight: 700; text-transform: uppercase; letter-spacing: .16em; font-size: clamp(14px, 6.4cqi, 26px); }
  .digits { font-family: var(--display); font-weight: 800; font-size: 44cqi; line-height: .82; font-variant-numeric: tabular-nums; }
  .app[data-status="paused"] .digits { opacity: .45; }
  .cycle { color: var(--muted); font-size: clamp(13px, 4.6cqi, 18px); font-variant-numeric: tabular-nums; }

  .strip-wrap { display: flex; flex-direction: column; gap: 8px; }
  .row-head { display: flex; justify-content: space-between; gap: 12px; }
  .strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 20), minmax(0, 1fr)); gap: 4px; }
  .strip li { height: 10px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .strip li.done { background: color-mix(in srgb, var(--fg) 55%, transparent); }
  .strip li.now { background: var(--phase); }

  .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 10px; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .primary { min-width: 190px; height: 58px; padding-inline: 24px; border: 0; background: var(--phase); color: var(--ink-on-phase);
    font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; transition: background .3s, transform .08s; }
  .primary:active { transform: scale(.98); }
  .ghost { height: 58px; padding-inline: 20px; background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
  .ghost:hover { border-color: var(--muted); }

  .hint { margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
  kbd { font-family: var(--body); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

  .plan-wrap { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: step; }
  .plan li { display: grid; grid-template-columns: 22px 72px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px; align-items: baseline;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: border-color .3s; }
  .plan li::before { counter-increment: step; content: counter(step); grid-row: span 2; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--muted); }
  .plan .fig { grid-row: span 2; align-self: center; width: 72px; height: auto; }
  .plan .p-name { font-weight: 600; }
  .plan .p-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .plan .p-note { grid-column: 3 / -1; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .plan li.now { border-color: var(--phase); }
  .plan li.now::before, .plan li.now .p-count { color: var(--phase); }
  .outro { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }

  details { border-top: 1px solid var(--line); padding-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; width: fit-content; }
  fieldset { border: 0; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  fieldset:disabled { opacity: .45; }
  fieldset label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  fieldset input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font: 600 18px var(--body); font-variant-numeric: tabular-nums; }
  .note { margin: 10px 0 0; color: var(--muted); font-size: 12px; }

  @media (max-width: 420px) {
    fieldset { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .primary { min-width: 0; flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="app" id="app" data-phase="prep" data-status="idle">
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1 id="title">Intervalos</h1>
        <p id="summary"></p>
      </div>
      <div class="total">
        <span class="lbl">Tiempo restante</span>
        <strong id="totalLeft">0:00</strong>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Rutinas"></nav>

    <section class="current">
      <svg class="fig" id="nowFig" viewBox="0 -6 200 132" aria-hidden="true"></svg>
      <span class="lbl" id="nowTag"></span>
      <div class="now-name" id="nowName"></div>
      <p class="now-note" id="nowNote"></p>
    </section>

    <section class="dial" aria-live="polite">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="92"></circle>
        <circle class="prog" id="prog" cx="100" cy="100" r="92"></circle>
      </svg>
      <div class="center">
        <div class="phase-label" id="phaseLabel"></div>
        <div class="digits" id="digits"></div>
        <div class="cycle" id="cycleLabel"></div>
      </div>
    </section>

    <div class="strip-wrap">
      <div class="row-head">
        <span class="lbl">Ciclos</span>
        <span class="lbl" id="stripCount"></span>
      </div>
      <ol class="strip" id="strip"></ol>
    </div>

    <div class="controls">
      <button class="primary" id="toggle" type="button">Comenzar</button>
      <button class="ghost" id="reset" type="button">Reiniciar</button>
    </div>
    <p class="hint"><kbd>Espacio</kbd> iniciar o pausar · <kbd>R</kbd> reiniciar</p>

    <section class="plan-wrap">
      <div class="row-head">
        <span class="lbl">Rutina</span>
        <span class="lbl" id="roundLabel"></span>
      </div>
      <ol class="plan" id="plan"></ol>
      <p class="outro" id="outro"></p>
    </section>

    <details>
      <summary>Ajustes</summary>
      <fieldset id="settings">
        <label for="setPrep">Cuenta regresiva (s)<input id="setPrep" type="number" inputmode="numeric" min="0" max="30"></label>
        <label for="setWork">Trabajo (s)<input id="setWork" type="number" inputmode="numeric" min="1" max="600"></label>
        <label for="setRest">Descanso (s)<input id="setRest" type="number" inputmode="numeric" min="0" max="600"></label>
        <label for="setCycles">Ciclos<input id="setCycles" type="number" inputmode="numeric" min="1" max="60"></label>
      </fieldset>
      <p class="note" id="settingsNote"></p>
    </details>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const app = $("app"), prog = $("prog"), digits = $("digits"), phaseLabel = $("phaseLabel"),
        cycleLabel = $("cycleLabel"), totalLeft = $("totalLeft"), strip = $("strip"),
        stripCount = $("stripCount"), toggleBtn = $("toggle"), settings = $("settings"),
        tabs = $("tabs"), plan = $("plan"), nowTag = $("nowTag"), nowName = $("nowName"),
        nowNote = $("nowNote"), roundLabel = $("roundLabel");

  const CIRC = 2 * Math.PI * 92;
  prog.style.strokeDasharray = CIRC;

  // prepEach: countdown before every cycle (hangboard: time to grab the edge). Otherwise a single countdown at the start
  // and pips in the last 3 s of each rest.
  const PROGRAMS = {
    dedos: {
      tab: "Dedos", title: "No hangs", workLabel: "Cuelga", prepEach: true,
      defaults: { prep: 5, work: 10, rest: 20, cycles: 20 },
      items: [
        { name: "Brazo izquierdo", note: "No hang a un brazo", reps: 6, fig: "hang", fingers: 4 },
        { name: "Brazo derecho", note: "No hang a un brazo", reps: 6, fig: "hang", fingers: 4, mirror: true },
        { name: "3 dedos · izquierda", note: "No hang a un brazo con 3 dedos", reps: 2, fig: "hang", fingers: 3 },
        { name: "3 dedos · derecha", note: "No hang a un brazo con 3 dedos", reps: 2, fig: "hang", fingers: 3, mirror: true },
        { name: "2 dedos · izquierda", note: "No hang a un brazo con 2 dedos", reps: 2, fig: "hang", fingers: 2 },
        { name: "2 dedos · derecha", note: "No hang a un brazo con 2 dedos", reps: 2, fig: "hang", fingers: 2, mirror: true }
      ],
      outro: ""
    },
    rodillas: {
      tab: "Rodillas", title: "Rodillas sanas", workLabel: "Entrena", prepEach: false, rounds: 2,
      defaults: { prep: 5, work: 40, rest: 20, cycles: 10 },
      items: [
        { name: "Sentadilla en pared", note: "Rodillas detrás de la punta de los pies; baja solo hasta donde estés cómodo", fig: "wallsit" },
        { name: "Zancada atrás alternada", note: "Lenta y controlada; apóyate en una silla si necesitas equilibrio", fig: "lunge" },
        { name: "Elevación lateral de pierna", note: "Tumbado de lado. Pierna izquierda en la ronda 1, derecha en la ronda 2", sides: ["izquierda", "derecha"], fig: "legraise" },
        { name: "Puente de glúteos", note: "Aprieta los glúteos arriba", fig: "bridge" },
        { name: "Elevación de talones lenta", note: "2 s arriba, 2 s abajo", fig: "calf" }
      ],
      outro: "Al terminar: estiramiento de isquiotibiales 20–30 s por lado. 3–4 veces por semana, con un día de descanso entre sesiones."
    },
    hombros: {
      tab: "Hombros", title: "Hombros sanos", workLabel: "Entrena", prepEach: false, rounds: 2,
      defaults: { prep: 5, work: 40, rest: 20, cycles: 10 },
      items: [
        { name: "Rotación externa con banda", note: "Codo pegado al costado; gira el antebrazo hacia afuera", fig: "extrot" },
        { name: "Pájaro invertido o separación con banda", note: "Lleva los omóplatos atrás y júntalos", fig: "pullapart" },
        { name: "Scaption", note: "Pulgares arriba; sube los brazos a la altura del hombro, unos 30° por delante del costado", fig: "scaption" },
        { name: "Deslizamiento en pared", note: "Espalda y brazos contra la pared; desliza los brazos arriba y abajo", fig: "wallslide" },
        { name: "Rotación interna tumbado de lado", note: "Solo peso ligero", fig: "introt" }
      ],
      outro: "Sin peso o banda muy ligera, máximo ~2 kg. Para cualquier movimiento que duela. 2–3 veces por semana. Basado en la rutina de manguito rotador de Eric Hörst."
    },
    core: {
      tab: "Core", title: "Core sano", workLabel: "Entrena", prepEach: false, rounds: 2,
      defaults: { prep: 5, work: 40, rest: 20, cycles: 10 },
      items: [
        { name: "Curl-up de McGill", note: "Una rodilla flexionada, manos bajo la zona lumbar; eleva un poco cabeza y hombros, sostén ~10 s por repetición", fig: "curlup" },
        { name: "Plancha lateral · izquierda", note: "Rodillas en el suelo si 40 s es mucho, o series de 10 s", fig: "sideplank" },
        { name: "Plancha lateral · derecha", note: "Rodillas en el suelo si 40 s es mucho, o series de 10 s", fig: "sideplank", mirror: true },
        { name: "Bird dog alternado", note: "Sostén cada repetición 1–3 s", fig: "birddog" },
        { name: "Dead bug", note: "Zona lumbar pegada al suelo todo el tiempo", fig: "deadbug" }
      ],
      outro: "Basado en el «Big 3» de Stuart McGill (curl-up, plancha lateral, bird dog) más el dead bug."
    }
  };

  const LIMITS = { prep: [0, 30], work: [1, 600], rest: [0, 600], cycles: [1, 60] };
  const INPUTS = { prep: $("setPrep"), work: $("setWork"), rest: $("setRest"), cycles: $("setCycles") };
  const LABELS = { prep: "Prepárate", rest: "Descansa", done: "Terminado" };

  // Figures: joints h head, n neck, p pelvis, s1/s2 shoulders (front views), e/w elbow/wrist, k/f knee/ankle, t toes.
  // 1 = near side (or the working side), 2 = far side. Pose `a` animates to `b` and back; holds have only `a`.
  const FRONT = { h: [100, 18], n: [100, 30], s1: [89, 32], s2: [111, 32], p: [100, 64], k1: [93, 90], f1: [90, 117], k2: [107, 90], f2: [110, 117] };
  const SIDE = { h: [100, 17], n: [100, 29], p: [100, 62], k1: [101, 90], f1: [100, 117], t1: [111, 117], k2: [99, 90], f2: [98, 117], t2: [109, 117] };
  const up = (pose, dy, keys) => Object.fromEntries(Object.entries(pose).map(([k, v]) => [k, keys.includes(k) ? [v[0], v[1] - dy] : v]));
  const ln = (cls, a, b) => `<line class="${cls}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;

  const FIGS = {
    hang: { // seen from behind: the working arm (left) is on the left
      front: true, hot: true,
      a: { ...FRONT, e1: [87, 50], w1: [86, 69], e2: [114, 50], w2: [116, 66], wt: [86, 110] },
      b: { ...FRONT, s1: [89, 30], e1: [87, 47], w1: [86, 64], e2: [114, 50], w2: [116, 66], wt: [86, 101] },
      props: (j, it) => {
        const [x, y] = j.w1, [wx, wy] = j.wt, n = it.fingers || 4;
        let s = ln("cord", [x, y + 6], [wx, wy - 7]) + `<rect class="edge" x="${x - 7}" y="${y - 1}" width="14" height="7" rx="2"/>` + `<circle class="acc" cx="${wx}" cy="${wy}" r="7"/>`;
        s += `<rect class="edge" x="146" y="12" width="44" height="10" rx="2"/>`;
        for (let i = 0; i < n; i++) { const fx = 168 - (n - 1) * 3.5 + i * 7; s += ln("finger", [fx, 0], [fx, 14]); }
        return s;
      }
    },
    wallsit: {
      a: { h: [62, 46], n: [61, 57], p: [61, 90], k1: [90, 90], f1: [91, 117], t1: [102, 117], k2: [88, 92], f2: [89, 117], t2: [100, 117],
           e1: [70, 74], w1: [86, 84], e2: [68, 75], w2: [84, 86] },
      back: () => ln("wall", [50, 4], [50, 121])
    },
    lunge: {
      a: { ...SIDE, e1: [90, 46], w1: [100, 60], e2: [91, 46], w2: [100, 61] },
      b: { h: [94, 40], n: [94, 51], p: [94, 84], k1: [122, 86], f1: [122, 117], t1: [133, 117], k2: [82, 112], f2: [58, 108], t2: [66, 117],
           e1: [84, 68], w1: [94, 82], e2: [85, 68], w2: [94, 83] }
    },
    legraise: {
      a: { h: [34, 100], n: [46, 108], p: [88, 110], k1: [116, 109], f1: [144, 110], k2: [116, 112], f2: [144, 114],
           e1: [62, 100], w1: [70, 115], e2: [30, 114], w2: [28, 100] },
      b: { h: [34, 100], n: [46, 108], p: [88, 110], k1: [114, 96], f1: [138, 82], k2: [116, 112], f2: [144, 114],
           e1: [62, 100], w1: [70, 115], e2: [30, 114], w2: [28, 100] }
    },
    bridge: {
      a: { h: [34, 108], n: [46, 113], p: [86, 114], k1: [106, 90], f1: [118, 117], t1: [127, 117], k2: [104, 91], f2: [116, 117], t2: [125, 117],
           e1: [62, 116], w1: [78, 117], e2: [61, 116], w2: [77, 117] },
      b: { h: [34, 107], n: [46, 111], p: [84, 95], k1: [108, 84], f1: [118, 117], t1: [127, 117], k2: [106, 85], f2: [116, 117], t2: [125, 117],
           e1: [62, 116], w1: [78, 117], e2: [61, 116], w2: [77, 117] }
    },
    calf: {
      a: { ...SIDE, e1: [115, 41], w1: [134, 44], e2: [113, 42], w2: [132, 46] },
      b: { ...up({ ...SIDE, e1: [115, 41], w1: [134, 44], e2: [113, 42], w2: [132, 46] }, 7, ["h", "n", "p", "k1", "k2", "e1", "e2", "w1", "w2"]),
           f1: [103, 110], t1: [112, 117], f2: [101, 110], t2: [110, 117] },
      back: () => ln("wall", [138, 4], [138, 121])
    },
    extrot: {
      front: true,
      a: { ...FRONT, e1: [86, 52], w1: [95, 58], e2: [114, 52], w2: [105, 58] },
      b: { ...FRONT, e1: [86, 52], w1: [67, 50], e2: [114, 52], w2: [133, 50] },
      back: j => ln("band", j.w1, j.w2)
    },
    pullapart: {
      front: true,
      a: { ...FRONT, e1: [93, 36], w1: [97, 38], e2: [107, 36], w2: [103, 38] },
      b: { ...FRONT, e1: [70, 32], w1: [50, 33], e2: [130, 32], w2: [150, 33] },
      props: j => ln("band", j.w1, j.w2)
    },
    scaption: {
      front: true,
      a: { ...FRONT, e1: [86, 50], w1: [85, 68], e2: [114, 50], w2: [115, 68] },
      b: { ...FRONT, e1: [72, 30], w1: [56, 28], e2: [128, 30], w2: [144, 28] },
      props: j => `<circle class="acc" cx="${j.w1[0]}" cy="${j.w1[1]}" r="4"/><circle class="acc" cx="${j.w2[0]}" cy="${j.w2[1]}" r="4"/>`
    },
    wallslide: {
      front: true,
      a: { ...FRONT, e1: [70, 34], w1: [70, 14], e2: [130, 34], w2: [130, 14] },
      b: { ...FRONT, e1: [79, 15], w1: [88, 0], e2: [121, 15], w2: [112, 0] },
      back: () => `<rect class="wallfill" x="58" y="-6" width="84" height="127" rx="4"/>`
    },
    introt: {
      a: { h: [30, 94], n: [46, 102], p: [92, 106], k1: [118, 100], f1: [146, 108], k2: [118, 108], f2: [146, 113],
           e1: [68, 96], w1: [90, 98], e2: [56, 119], w2: [82, 119] },
      b: { h: [30, 94], n: [46, 102], p: [92, 106], k1: [118, 100], f1: [146, 108], k2: [118, 108], f2: [146, 113],
           e1: [68, 96], w1: [90, 98], e2: [56, 119], w2: [60, 95] },
      back: () => `<rect class="pad" x="14" y="101" width="28" height="9" rx="4"/>`,
      props: j => `<circle class="acc" cx="${j.w2[0]}" cy="${j.w2[1]}" r="4"/>`
    },
    curlup: {
      a: { h: [34, 107], n: [48, 112], p: [88, 113], k1: [106, 90], f1: [118, 117], t1: [127, 117], k2: [116, 114], f2: [144, 115], t2: [146, 108],
           e1: [62, 118], w1: [78, 115], e2: [60, 118], w2: [76, 115] },
      b: { h: [38, 95], n: [50, 104], p: [88, 113], k1: [106, 90], f1: [118, 117], t1: [127, 117], k2: [116, 114], f2: [144, 115], t2: [146, 108],
           e1: [62, 118], w1: [78, 115], e2: [60, 118], w2: [76, 115] }
    },
    sideplank: {
      a: { h: [56, 88], n: [66, 96], p: [102, 106], k1: [121, 111], f1: [140, 116], k2: [122, 113], f2: [142, 118],
           e1: [67, 77], w1: [68, 58], e2: [64, 118], w2: [86, 118] }
    },
    birddog: {
      a: { h: [58, 78], n: [72, 84], p: [112, 88], e1: [73, 100], w1: [72, 117], e2: [75, 100], w2: [74, 117],
           k1: [112, 117], f1: [138, 117], k2: [110, 117], f2: [136, 117] },
      b: { h: [58, 78], n: [72, 84], p: [112, 88], e1: [53, 89], w1: [34, 91], e2: [75, 100], w2: [74, 117],
           k1: [112, 117], f1: [138, 117], k2: [138, 88], f2: [164, 86] }
    },
    deadbug: {
      a: { h: [34, 108], n: [48, 112], p: [88, 113], e1: [48, 94], w1: [48, 76], e2: [50, 94], w2: [50, 76],
           k1: [88, 85], f1: [114, 85], k2: [90, 86], f2: [116, 86] },
      b: { h: [34, 108], n: [48, 112], p: [88, 113], e1: [40, 96], w1: [24, 90], e2: [50, 94], w2: [50, 76],
           k1: [88, 85], f1: [114, 85], k2: [116, 108], f2: [144, 110] }
    }
  };

  const pts = list => list.filter(Boolean).map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const pl = (cls, list) => `<polyline class="${cls}" points="${pts(list)}"/>`;

  function pose(def, t) {
    if (!def.b) return def.a;
    const j = {};
    for (const k of Object.keys(def.a)) {
      const a = def.a[k], b = def.b[k] || a;
      j[k] = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }
    return j;
  }

  function scene(item, t, mirror) {
    const def = FIGS[item.fig];
    if (!def) return "";
    const j = pose(def, t), far = def.front ? "near" : "far";
    const s1 = j.s1 || j.n, s2 = j.s2 || j.n;
    let o = ln("floor", [6, 121], [194, 121]) + (def.back ? def.back(j, item) : "");
    o += pl(far, [s2, j.e2, j.w2]) + pl(far, [j.p, j.k2, j.f2, j.t2]);
    o += pl("near", [j.h, j.n, j.p]) + (j.s1 ? pl("near", [j.s1, j.n, j.s2]) : "");
    o += `<circle class="head" cx="${j.h[0].toFixed(1)}" cy="${j.h[1].toFixed(1)}" r="8"/>`;
    o += pl("near", [j.p, j.k1, j.f1, j.t1]) + pl(def.hot ? "hot" : "near", [s1, j.e1, j.w1]);
    o += def.props ? def.props(j, item) : "";
    return mirror ? `<g transform="matrix(-1 0 0 1 200 0)">${o}</g>` : o;
  }

  let progId = "dedos";
  try { const t = localStorage.getItem("intervalos.tab"); if (PROGRAMS[t]) progId = t; } catch (e) {}
  let program = PROGRAMS[progId], cfg = loadCfg(progId), seq = [];

  let phases = [], totalMs = 0, idx = 0, phaseElapsed = 0, status = "idle";
  let timer = null, lastNow = 0, enteredIdx = -1, lastSec = null, wakeLock = null;

  function clamp(k, v) {
    const [lo, hi] = LIMITS[k];
    return Math.min(hi, Math.max(lo, Math.round(v)));
  }

  function loadCfg(id) {
    const defaults = PROGRAMS[id].defaults, c = { ...defaults };
    try {
      let raw = localStorage.getItem("intervalos.cfg." + id);
      if (!raw && id === "dedos") raw = localStorage.getItem("intervalos.cfg");
      const saved = JSON.parse(raw || "null");
      if (saved) for (const k of Object.keys(defaults)) if (Number.isFinite(saved[k])) c[k] = clamp(k, saved[k]);
    } catch (e) {}
    return c;
  }

  // One entry per cycle: which plan item it is and the label shown while doing it.
  function buildSeq() {
    seq = [];
    if (program.rounds) {
      for (let r = 0; r < program.rounds; r++)
        program.items.forEach((it, i) => seq.push({
          item: i,
          label: it.sides ? `${it.name} · ${it.sides[r % it.sides.length]}` : it.name,
          mirror: it.sides ? r % 2 === 1 : !!it.mirror
        }));
    } else {
      program.items.forEach((it, i) => {
        for (let k = 1; k <= it.reps; k++) seq.push({ item: i, label: it.name, rep: k, mirror: !!it.mirror });
      });
    }
  }
  const entryFor = c => seq[(c - 1) % seq.length];

  function buildTabs() {
    tabs.innerHTML = "";
    for (const [id, p] of Object.entries(PROGRAMS)) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(id === progId));
      b.textContent = p.tab;
      b.addEventListener("click", () => switchTo(id));
      tabs.appendChild(b);
    }
  }

  function buildPlan() {
    plan.innerHTML = "";
    for (const it of program.items) {
      const li = document.createElement("li");
      const name = document.createElement("span"), count = document.createElement("span"), note = document.createElement("span");
      name.className = "p-name"; count.className = "p-count"; note.className = "p-note";
      name.textContent = it.name;
      note.textContent = it.note;
      const thumb = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      thumb.setAttribute("class", "fig");
      thumb.setAttribute("viewBox", "0 -6 200 132");
      thumb.setAttribute("aria-hidden", "true");
      thumb.innerHTML = scene(it, 1, !!it.mirror);
      li.append(thumb, name, count, note);
      plan.appendChild(li);
    }
    $("outro").textContent = program.outro;
    $("outro").hidden = !program.outro;
    $("title").textContent = program.title;
    $("settingsNote").textContent = (program.prepEach
      ? "La cuenta regresiva se repite antes de cada serie. "
      : "La cuenta regresiva es solo al inicio; los últimos 3 s de cada descanso suenan. ") +
      "Los cambios reinician el temporizador. Solo se pueden editar cuando está detenido.";
  }

  function build() {
    phases = [];
    for (let c = 1; c <= cfg.cycles; c++) {
      if (cfg.prep > 0 && (program.prepEach || c === 1)) phases.push({ type: "prep", dur: cfg.prep * 1000, cycle: c });
      phases.push({ type: "work", dur: cfg.work * 1000, cycle: c });
      if (c < cfg.cycles && cfg.rest > 0) phases.push({ type: "rest", dur: cfg.rest * 1000, cycle: c });
    }
    totalMs = phases.reduce((s, p) => s + p.dur, 0);
    strip.style.setProperty("--n", cfg.cycles);
    strip.innerHTML = "";
    for (let c = 1; c <= cfg.cycles; c++) {
      const li = document.createElement("li");
      li.title = `${c}. ${entryFor(c).label}`;
      strip.appendChild(li);
    }
    $("summary").textContent = `${cfg.work} s trabajo · ${cfg.rest} s descanso · ${cfg.cycles} ciclos`;
    for (const k of Object.keys(INPUTS)) INPUTS[k].value = cfg[k];
  }

  let ctx = null;
  function ensureAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
  }
  function note(freq, dur, when = 0, vol = 0.35) {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const g = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 3000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(filter).connect(ctx.destination);
    [[1, 1], [4, 0.2], [10, 0.04]].forEach(([mult, amp]) => {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = "sine";
      o.frequency.value = freq * mult;
      og.gain.value = amp;
      o.connect(og).connect(g);
      o.start(t);
      o.stop(t + dur + 0.05);
    });
  }
  const seqNotes = (notes, step, fn) => notes.forEach((f, i) => fn(f, i * step, i === notes.length - 1));

  const sounds = {
    pip: () => { ensureAudio(); note(659, 0.35, 0, 0.4); },
    work: () => { ensureAudio(); seqNotes([523, 659, 784], 0.07, (f, w) => note(f, 0.8, w, 0.35)); },
    rest: () => { ensureAudio(); note(659, 0.5, 0, 0.38); note(440, 0.8, 0.18, 0.38); },
    done: () => { ensureAudio(); seqNotes([523, 659, 784, 1046, 1318], 0.1, (f, w, last) => note(f, last ? 1.2 : 0.5, w, 0.35)); }
  };

  async function lockScreen() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; }
  }
  function unlockScreen() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function elapsedBefore(i) {
    let s = 0;
    for (let j = 0; j < i; j++) s += phases[j].dur;
    return s;
  }

  // The card figure loops a → b → a every 2.4 s; static end pose when reduced motion is requested.
  const nowFig = $("nowFig");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let figItem = null, figMirror = false, figDrawn = "";
  function showFig(item, mirror) { figItem = item; figMirror = mirror; }
  function animate(now) {
    if (figItem) {
      const def = FIGS[figItem.fig], moving = def && def.b && !reduceMotion.matches;
      const key = figItem.name + figMirror;
      if (moving || key !== figDrawn) {
        const t = moving ? (1 - Math.cos(now / 1200 * Math.PI)) / 2 : 1;
        nowFig.innerHTML = scene(figItem, t, figMirror);
        figDrawn = moving ? "" : key;
      }
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  function renderPlan(e) {
    [...plan.children].forEach((li, i) => {
      const it = program.items[i], current = e && e.item === i;
      li.classList.toggle("now", !!current);
      li.querySelector(".p-count").textContent = it.reps > 1 ? (current ? `${e.rep} / ${it.reps}` : `×${it.reps}`) : "";
    });
  }

  function render() {
    app.dataset.status = status;
    settings.disabled = status === "running" || status === "paused";

    if (status === "done") {
      app.dataset.phase = "done";
      phaseLabel.textContent = LABELS.done;
      digits.textContent = cfg.cycles;
      cycleLabel.textContent = cfg.cycles === 1 ? "1 ciclo completado" : `${cfg.cycles} ciclos completados`;
      prog.style.strokeDashoffset = 0;
      totalLeft.textContent = "0:00";
      [...strip.children].forEach(li => { li.className = "done"; });
      stripCount.textContent = `${cfg.cycles} / ${cfg.cycles}`;
      nowTag.textContent = "Completado";
      nowName.textContent = "Rutina completada";
      nowNote.textContent = program.outro || "Buen trabajo.";
      roundLabel.textContent = "";
      renderPlan(null);
      toggleBtn.textContent = "Repetir";
      return;
    }

    const p = phases[idx];
    const remain = p.dur - phaseElapsed;
    const secs = Math.max(1, Math.ceil(remain / 1000));

    if (status === "running") {
      if (idx !== enteredIdx) {
        enteredIdx = idx;
        lastSec = null;
        if (p.type === "work") sounds.work();
        if (p.type === "rest") sounds.rest();
      }
      if (secs !== lastSec) {
        if (p.type === "prep") sounds.pip();
        if (p.type === "rest" && !program.prepEach && secs <= 3) sounds.pip();
      }
      lastSec = secs;
    }

    app.dataset.phase = p.type;
    phaseLabel.textContent = status === "paused" ? "En pausa" : p.type === "work" ? program.workLabel : LABELS[p.type];
    digits.textContent = secs;
    cycleLabel.textContent = `Ciclo ${p.cycle} de ${cfg.cycles}`;
    prog.style.strokeDashoffset = CIRC * Math.min(1, phaseElapsed / p.dur);
    totalLeft.textContent = fmt(totalMs - elapsedBefore(idx) - phaseElapsed);

    const upcoming = p.type === "rest" ? p.cycle + 1 : p.cycle;
    const e = entryFor(upcoming);
    nowTag.textContent = `${p.type === "work" ? "Ahora" : "Siguiente"} · ${upcoming} de ${cfg.cycles}`;
    nowName.textContent = e.label;
    nowNote.textContent = program.items[e.item].note;
    showFig(program.items[e.item], e.mirror);
    renderPlan(e);
    if (program.rounds) {
      const per = program.items.length;
      roundLabel.textContent = `Ronda ${Math.floor((upcoming - 1) / per) + 1} de ${Math.ceil(cfg.cycles / per)}`;
    } else {
      roundLabel.textContent = `${cfg.cycles} series`;
    }

    const completed = p.type === "rest" ? p.cycle : p.cycle - 1;
    [...strip.children].forEach((li, i) => {
      const c = i + 1;
      li.className = c <= completed ? "done" : c === p.cycle ? "now" : "";
    });
    stripCount.textContent = `${completed} / ${cfg.cycles}`;
    toggleBtn.textContent = status === "running" ? "Pausar" : status === "paused" ? "Continuar" : "Comenzar";
  }

  function tick() {
    const now = performance.now();
    phaseElapsed += now - lastNow;
    lastNow = now;
    while (phaseElapsed >= phases[idx].dur) {
      phaseElapsed -= phases[idx].dur;
      idx++;
      if (idx >= phases.length) return finish();
    }
    render();
  }

  function start() {
    ensureAudio();
    if (status === "done") reset();
    status = "running";
    lastNow = performance.now();
    clearInterval(timer);
    timer = setInterval(tick, 50);
    lockScreen();
    render();
  }

  function pause() {
    tick();
    if (status !== "running") return;
    status = "paused";
    clearInterval(timer);
    unlockScreen();
    render();
  }

  function finish() {
    clearInterval(timer);
    status = "done";
    idx = phases.length - 1;
    phaseElapsed = phases[idx].dur;
    sounds.done();
    unlockScreen();
    render();
  }

  function reset() {
    clearInterval(timer);
    status = "idle";
    idx = 0;
    phaseElapsed = 0;
    enteredIdx = -1;
    lastSec = null;
    unlockScreen();
    build();
    render();
  }

  function toggle() {
    if (status === "running") pause();
    else start();
  }

  function switchTo(id) {
    if (id === progId) return;
    if ((status === "running" || status === "paused") && !confirm("¿Cambiar de rutina? Se reiniciará el temporizador.")) return;
    progId = id;
    try { localStorage.setItem("intervalos.tab", id); } catch (e) {}
    program = PROGRAMS[id];
    cfg = loadCfg(id);
    buildSeq();
    buildTabs();
    buildPlan();
    reset();
  }

  toggleBtn.addEventListener("click", toggle);
  $("reset").addEventListener("click", reset);

  for (const k of Object.keys(INPUTS)) {
    INPUTS[k].addEventListener("change", () => {
      const v = Number(INPUTS[k].value);
      cfg[k] = Number.isFinite(v) ? clamp(k, v) : program.defaults[k];
      try { localStorage.setItem("intervalos.cfg." + progId, JSON.stringify(cfg)); } catch (e) {}
      reset();
    });
  }

  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, button, summary")) {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") return;
    }
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.key === "r" || e.key === "R") reset();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && status === "running") lockScreen();
  });

  buildSeq();
  buildTabs();
  buildPlan();
  reset();
})();
</script>
</body>
</html>
